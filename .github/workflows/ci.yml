name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Round-trips the schema fixtures through the Rust types (schema/tests)
      # and runs the CLI unit tests.
      - run: cargo test --workspace

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir server typecheck
      # Round-trips the schema fixtures through the generated TS types.
      - run: pnpm --dir server test
      - run: pnpm --dir infra typecheck
