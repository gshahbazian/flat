name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: generated schemas are current
        run: |
          cargo run -p flat-schema --bin codegen
          git diff --exit-code schema/json

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: generated TS types are current
        run: |
          npx json2ts ../schema/json/protocol.schema.json -o src/schema.ts \
            --bannerComment "/* Generated from Rust (schema/src/lib.rs) via npm run codegen. Do not edit. */"
          git diff --exit-code src/schema.ts
