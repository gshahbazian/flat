[package]
name = "flat-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "flat: filesystem-first ticket CLI"

[[bin]]
name = "flat"
path = "src/main.rs"

[dependencies]
flat-schema = { path = "../schema" }
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ulid = "1"
ureq = { version = "2", features = ["json"] }
diffy = "0.4"
